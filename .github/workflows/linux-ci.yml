name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Fedora 44 validation
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Bootstrap checkout tools
        run: dnf install --assumeyes git tar gzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Fedora dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Validate and build Fedora RPM/SRPM and source/widget packages
        run: bash scripts/build-release.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history and working tree with checksum-verified Gitleaks
        run: bash scripts/scan-secrets.sh

  release:
    name: Development prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, secret-scan]
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Bootstrap checkout tools
        run: dnf install --assumeyes git tar gzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release lineage
        run: bash scripts/check-release-tag.sh
      - name: Install Fedora dependencies
        run: bash scripts/install-ci-dependencies.sh
      - name: Rebuild and validate release packages from the tagged commit
        run: bash scripts/build-release.sh
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "Loofi Pulse $GITHUB_REF_NAME (development)" \
            --notes-file RELEASE_NOTES.md \
            build/validation/dist/*.tar.gz build/validation/dist/*.rpm \
            build/validation/dist/*.plasmoid build/validation/dist/SHA256SUMS
