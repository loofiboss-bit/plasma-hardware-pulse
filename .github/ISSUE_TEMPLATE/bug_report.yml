name: Bug report
description: Report a reproducible problem in Loofi Pulse.
body:
  - type: markdown
    attributes:
      value: |
        Do not put secrets or personal telemetry in this issue. For vulnerabilities, use SECURITY.md and private reporting.
        A missing sensor can be a kernel/driver limitation; include the quality explanation shown by Pulse.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include installation source (RPM, local build, widget bundle).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fedora/distribution version, Plasma/Qt version, Wayland or X11, relevant device/driver, desktop app or widget.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed behavior
      description: Provide repeatable steps, expected result, actual result, and whether it survives a restart.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant quality state, short logs, or screenshots. Review exports first; leave process identities excluded unless needed.
