<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#101722" />
      <stop offset="100%" stop-color="#080c12" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="15%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#14c3d8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#1d99f3" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="85%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#1d99f3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d99f3" />
      <stop offset="100%" stop-color="#14c3d8" />
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d99f3" stop-opacity="0" />
      <stop offset="25%" stop-color="#1d99f3" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#14c3d8" stop-opacity="1" />
      <stop offset="75%" stop-color="#2ecc71" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1d99f3" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#cyanGlow)" />
  <rect width="1200" height="360" fill="url(#blueGlow)" />

  <!-- Subtle Precision Grid Pattern -->
  <g opacity="0.08" stroke="#14c3d8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Hexagonal Tech Elements in Background -->
  <g opacity="0.06" stroke="#1d99f3" stroke-width="1.5" fill="none">
    <polygon points="1020,40 1060,63 1060,109 1020,132 980,109 980,63" />
    <polygon points="1080,100 1120,123 1120,169 1080,192 1040,169 1040,123" />
    <polygon points="960,120 1000,143 1000,189 960,212 920,189 920,143" />
  </g>

  <!-- Left: Large App Logo Badge with Glow -->
  <g transform="translate(68, 68)" filter="url(#strongGlow)">
    <!-- Shadow Card -->
    <rect x="-4" y="-4" width="136" height="136" rx="30" fill="#000000" opacity="0.4" />
    <!-- Gradient Background -->
    <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#logoBg)" />
    <!-- Glass Sheen -->
    <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#sheen)" />
    <!-- Inner Border -->
    <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Heartbeat / Telemetry Pulse Icon inside Logo -->
    <path d="M34 26 V88 H56 L66 48 L76 104 L84 74 L90 88 H102"
          fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="102" cy="88" r="6" fill="#ffffff" />
  </g>

  <!-- Center Text & Hierarchy -->
  <!-- Top Version & Environment Tag -->
  <g transform="translate(236, 74)">
    <rect x="0" y="0" width="204" height="26" rx="13" fill="#14c3d8" fill-opacity="0.12" stroke="#14c3d8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#2ecc71" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" fill="#14c3d8" letter-spacing="0.5">v0.18.0 · KDE PLASMA 6</text>
  </g>

  <!-- Main Title -->
  <text x="236" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Loofi Pulse
  </text>

  <!-- Subtitle -->
  <text x="236" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="18" font-weight="400" fill="#93a1b2">
    Next-Generation Linux Hardware Telemetry, PSI Stall Intelligence &amp; Flight Recorder
  </text>

  <!-- Feature Pills Strip -->
  <g transform="translate(236, 218)">
    <!-- Pill 1: Fedora Copr -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="32" rx="16" fill="#1b2430" stroke="#2d3d52" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e6edf3">📦 Fedora Copr &amp; RPM</text>
    </g>

    <!-- Pill 2: PSI & hwmon -->
    <g transform="translate(178, 0)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#1b2430" stroke="#2d3d52" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e6edf3">⚡ PSI &amp; Realtime hwmon</text>
    </g>

    <!-- Pill 3: In-Memory Flight Recorder -->
    <g transform="translate(348, 0)">
      <rect x="0" y="0" width="186" height="32" rx="16" fill="#1b2430" stroke="#2d3d52" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e6edf3">⏱️ Zero-Loss Flight Recorder</text>
    </g>

    <!-- Pill 4: C++ / QML Native -->
    <g transform="translate(544, 0)">
      <rect x="0" y="0" width="146" height="32" rx="16" fill="#1b2430" stroke="#2d3d52" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e6edf3">🚀 Pure C++ &amp; QML</text>
    </g>

    <!-- Pill 5: 100% Private -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="138" height="32" rx="16" fill="#1b2430" stroke="#2d3d52" stroke-width="1" />
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e6edf3">🔒 Local &amp; Private</text>
    </g>
  </g>

  <!-- Bottom Glowing ECG / Telemetry Pulse Line -->
  <g filter="url(#glow)">
    <path d="M0 320 
             L160 320 
             L180 320 
             L195 305 L210 338 L225 285 L240 348 L255 315 L265 320 
             L450 320 
             L470 310 L485 332 L500 292 L518 355 L535 300 L548 320 
             L750 320 
             L768 308 L782 334 L798 280 L815 352 L830 306 L842 320 
             L1020 320 
             L1035 312 L1048 330 L1062 295 L1078 345 L1092 312 L1102 320 
             L1200 320"
          fill="none" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Live Pulse Dot with Radar Ripple -->
  <g transform="translate(842, 320)">
    <circle cx="0" cy="0" r="14" fill="#14c3d8" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="8" fill="#14c3d8" fill-opacity="0.35" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>